name: Upstream Sync

# Weekly runs use Mac Studio's existing SSH authentication. GITHUB_TOKEN cannot
# push upstream changes to workflow files; this optional manual path needs a
# separate workflow-capable credential.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to propose
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      FORK_REPO: ${{ github.repository }}
      UPSTREAM_REF: ${{ inputs.ref || 'master' }}
    steps:
      - name: Require workflow-capable authentication
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set UPSTREAM_SYNC_TOKEN with repository and workflow write permissions, or use the Mac Studio sync runner."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub authentication
        run: gh auth setup-git
      - name: Propose upstream update
        run: |
          python3 scripts/sync-upstream.py --publish \
            --fork-repo "$FORK_REPO" \
            --fork-url "https://github.com/$FORK_REPO.git" \
            --upstream-ref "$UPSTREAM_REF"
